<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Call Entry Form</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

<style>
body {
  font-family: 'Roboto', sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.logos {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.logos img {
  width: 250px;
  height: 90px;
  object-fit: contain;
  margin: 0 15px;
}

h1 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 20px;
  font-weight: bold;
  color: black;
}

label {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  font-weight: bold;
  color: black;
}

label i {
  margin-right: 10px;
  color: #4CAF50;
}

form {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
  flex-grow: 1;
  padding-bottom: 80px;
}

.input-container {
  margin-bottom: 12px;
}

.input-container input,
.input-container select {
  width: 100%;
  padding: 8px;
  border-radius: 4px;
  border: 1px solid #ccc;
}

input[type="submit"] {
  background-color: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
  padding: 10px;
  width: 100%;
  font-weight: bold;
  border-radius: 4px;
}

input[type="submit"]:hover {
  background-color: #45a049;
}

#otherHub { display: none; }

.input-error { border: 2px solid red !important; }

#confirmationModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  justify-content: center;
  align-items: center;
}

#confirmationModal .modal-content {
  background: #fff;
  padding: 30px 40px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  padding: 10px;
  background-color: #fff;
  border-top: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="form-container">
  <div class="logos">
    <img src="logo1.png">
    <img src="logo2.png">
  </div>

  <h1>Late Call Entry Form</h1>

  <form id="lateCallForm">

    <div class="input-container">
      <label>Late Call Date *</label>
      <input type="date" id="date" required>
    </div>

    <div class="input-container">
      <label>Name *</label>
      <input type="text" id="name" required>
    </div>

    <div class="input-container">
      <label>Corp Number *</label>
      <input type="number" id="corp" required>
    </div>

    <div class="input-container">
      <label>Type of Duty *</label>
      <select id="typeOfDuty" required>
        <option value="">Select</option>
        <option>Regular Shift</option>
        <option>Overtime</option>
      </select>
    </div>

    <div class="input-container">
      <label>Hub *</label>
      <select id="hub" required>
        <option value="">Select</option>
        <option>Hub 1</option>
        <option>Hub 2</option>
        <option>Others</option>
      </select>
      <input type="text" id="otherHub" placeholder="Specify">
    </div>

    <div class="input-container">
      <label>Unit *</label>
      <input type="text" id="unit" required>
    </div>

    <div class="input-container">
      <label>Shift *</label>
      <select id="shift" required>
        <option value="">Select</option>
        <option>Day</option>
        <option>Night</option>
      </select>
    </div>

    <div class="input-container">
      <label>Time Out *</label>
      <input type="time" id="timeout" required>
    </div>

    <div class="input-container">
      <label>Late Call Hours *</label>
      <input type="number" id="lateHours" required>
    </div>

    <div class="input-container">
      <label>Trip / Reason *</label>
      <input type="text" id="trip" required>
    </div>

    <input type="submit" value="Submit">

  </form>
</div>

<div id="confirmationModal">
  <div class="modal-content">Submitted Successfully</div>
</div>

<script type="module">
import { submitLateCall } from './firebase.js';

document.getElementById('hub').addEventListener('change', function() {
  const other = document.getElementById('otherHub');
  other.style.display = this.value === "Others" ? "block" : "none";
});

document.getElementById('lateCallForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const data = {
    date: document.getElementById('date').value, // ✅ unchanged
    name: document.getElementById('name').value,
    corp: document.getElementById('corp').value,
    typeOfDuty: document.getElementById('typeOfDuty').value,
    hub: document.getElementById('hub').value,
    unit: document.getElementById('unit').value,
    shift: document.getElementById('shift').value,
    timeout: document.getElementById('timeout').value,

    // ✅ FIXED ONLY THIS LINE
    lateCallHours: parseInt(document.getElementById('lateHours').value),

    trip: document.getElementById('trip').value,
    status: 'Pending',
    dateSubmitted: new Date().toISOString()
  };

  const success = await submitLateCall(data);

  if(success){
    this.reset();
    document.getElementById('confirmationModal').style.display = 'flex';
    setTimeout(()=> {
      document.getElementById('confirmationModal').style.display='none';
    },2000);
  }
});
</script>

<footer>
© 2026 HMCAS
</footer>

</body>
</html>
