<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* (Keep all your existing CSS from before) */
</style>
</head>
<body>
<div class="header-logos">
    <img src="logo1.png" alt="Logo 1">
    <img src="logo2.png" alt="Logo 2">
</div>

<div id="loginPage">
    <div class="login-container">
        <h2>Supervisor Login</h2>
        <input type="text" id="username" placeholder="Username">
        <div style="position:relative;">
            <input type="password" id="password" placeholder="Password">
            <span style="position:absolute;right:10px;top:12px;cursor:pointer;" onclick="togglePassword()">👁️</span>
        </div>
        <div class="remember-me">
            <label>Remember Me <input type="checkbox" id="savePassword"></label>
        </div>
        <button id="loginBtn">Login</button>
        <div id="errorMessage" class="error-message"></div>
        <div class="forgot-password"><a onclick="forgotPassword()">Forgot Password?</a></div>
    </div>
</div>

<div id="dashboardPage">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 id="managerName"></h2>
        <button onclick="logout()" style="background:#f44336;color:#fff;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;">Logout</button>
    </div>
    <!-- (Keep all your dashboard HTML) -->
</div>

<script type="module">
import { getLateCalls, updateRequestStatus } from './firebase.js';

const supervisorsInit = [
    { username: "hkerkeni", fullName: "Habib Kerkeni", corp: "11748", email: "HKERKENI@hamad.qa", role: "Admin", password: "HMCAS1234" },
    { username: "hkhir", fullName: "Hicham Khir", corp: "22165", email: "HKHIR@hamad.qa", role: "Admin", password: "HMCAS1234" },
    { username: "mfarhat", fullName: "Mohamed Farhat", corp: "19306", email: "MFARHAT@hamad.qa", role: "Admin", password: "HMCAS1234" },
    { username: "mneji", fullName: "Mourad Neji", corp: "22179", email: "MNEJI@hamad.qa", role: "Admin", password: "HMCAS1234" },
    { username: "mjellali", fullName: "Mabrouk Jellali", corp: "12597", email: "MJELLALI@hamad.qa", role: "Admin", password: "HMCAS1234" },
    { username: "jcamins", fullName: "James Camins", corp: "45357", email: "JCAMINS@hamad.qa", role: "Admin", password: "HMCAS1234" }
];

// Initialize localStorage without overwriting existing users
let storedSup = JSON.parse(localStorage.getItem('supervisors')) || [];
supervisorsInit.forEach(initSup => {
    if(!storedSup.find(s => s.username.toLowerCase()===initSup.username.toLowerCase())){
        storedSup.push(initSup);
    }
});
localStorage.setItem('supervisors', JSON.stringify(storedSup));

function togglePassword(){
    const pwd = document.getElementById('password');
    pwd.type = pwd.type==="password"?"text":"password";
}

function login(){
    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value.trim();
    let supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];
    const sup = supervisors.find(s => s.username.toLowerCase()===usernameInput.toLowerCase() && s.password===passwordInput);
    if(sup){
        localStorage.setItem('currentSupervisor', JSON.stringify(sup));
        if(document.getElementById('savePassword').checked){
            localStorage.setItem('savedPassword', passwordInput);
        } else { localStorage.removeItem('savedPassword'); }
        checkLogin();
    } else {
        document.getElementById('errorMessage').innerText="Invalid username or password!";
    }
}

function forgotPassword(){
    const usernameInput = prompt("Enter your username to reset password:");
    if(!usernameInput) return;
    let supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];
    const supIndex = supervisors.findIndex(s => s.username.toLowerCase()===usernameInput.toLowerCase());
    if(supIndex === -1){ alert("Username not found!"); return; }
    const newPwd = prompt("Enter new password:"); if(!newPwd) return;
    supervisors[supIndex].password=newPwd;
    localStorage.setItem('supervisors', JSON.stringify(supervisors));
    alert("Password reset successfully!");
}

function logout(){
    localStorage.removeItem('currentSupervisor');
    document.getElementById('loginPage').style.display='flex';
    document.getElementById('dashboardPage').style.display='none';
    document.getElementById('username').value='';
    document.getElementById('password').value='';
    document.getElementById('errorMessage').innerText='';
    document.querySelector('#requestsTable tbody').innerHTML='';
}

function checkLogin(){
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if(sup){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('dashboardPage').style.display='block';
        document.getElementById('managerName').innerText = `${sup.fullName} CN ${sup.corp}`;
        // loadTable() and other dashboard initialization here
    }
}

document.getElementById('loginBtn').onclick = login;
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter'){ login(); } });

checkLogin();
</script>

</footer>
</body>
</html>
