<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: linear-gradient(to right, #eef2f3, #ffffff);
    color: #333;
}
.header-logos {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: #fff;
}
.header-logos img {height: 50px;}

#loginPage {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login-container {
    background:#fff;
    padding:40px;
    border-radius:10px;
    width:100%;
    max-width:400px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.login-container input, button {
    width:100%;
    padding:12px;
    margin-top:10px;
}
button {
    background:#4CAF50;
    color:#fff;
    border:none;
    cursor:pointer;
}
.error-message {color:red;}

#dashboardPage {display:none;padding:20px;}
.top-bar {margin-bottom:20px;}
table {width:100%;border-collapse:collapse;}
th,td {border:1px solid #ddd;padding:8px;text-align:center;}
.status-pending {background:gold;}
.status-approved {background:green;color:#fff;}
.status-rejected {background:red;color:#fff;}

footer {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    background:#fff;
    padding:10px;
}
</style>
</head>

<body>

<div class="header-logos">
    <img src="logo1.png">
    <img src="logo2.png">
</div>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-container">
    <h2>Supervisor Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="errorMessage" class="error-message"></div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">
    <h2 id="managerName"></h2>
    <button onclick="logout()">Logout</button>

    <div class="table-container">
        <table id="requestsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Corp</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
// ✅ USERS LIST
const supervisorsInit = [
    {username:"hkerkeni", fullName:"Habib Kerkeni", corp:"11748", email:"HKERKENI@hamad.qa", role:"Admin", password:"HMCAS1234"},
    {username:"hkhir", fullName:"Hicham Khir", corp:"22165", email:"HKHIR@hamad.qa", role:"Admin", password:"HMCAS1234"},
    {username:"mfarhat", fullName:"Mohamed Farhat", corp:"19306", email:"MFARHAT@hamad.qa", role:"Admin", password:"HMCAS1234"},
    {username:"mneji", fullName:"Mourad Neji", corp:"22179", email:"MNEJI@hamad.qa", role:"Admin", password:"HMCAS1234"},
    {username:"mjellali", fullName:"Mabrouk Jellali", corp:"12597", email:"MJELLALI@hamad.qa", role:"Admin", password:"HMCAS1234"},
    {username:"jcamins", fullName:"James Camins", corp:"45357", email:"JCAMINS@hamad.qa", role:"Admin", password:"HMCAS1234"}
];

// ✅ ONLY SET ON FIRST LOAD
if (!localStorage.getItem('supervisors')) {
    localStorage.setItem('supervisors', JSON.stringify(supervisorsInit));
}

// LOGIN
function login(){
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value.trim();

    const supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];

    const sup = supervisors.find(s =>
        s.username.toLowerCase() === username && s.password === password
    );

    if(sup){
        localStorage.setItem('currentSupervisor', JSON.stringify(sup));
        showDashboard();
    } else {
        document.getElementById('errorMessage').innerText = "Invalid login!";
    }
}

// SHOW DASHBOARD
function showDashboard(){
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if(!sup) return;

    document.getElementById('loginPage').style.display = "none";
    document.getElementById('dashboardPage').style.display = "block";

    document.getElementById('managerName').innerText =
        `${sup.fullName} (CN ${sup.corp}) - ${sup.role}`;

    loadTable();
}

// LOGOUT
function logout(){
    localStorage.removeItem('currentSupervisor');
    location.reload();
}

// SAMPLE TABLE DATA
function loadTable(){
    const tbody = document.querySelector('#requestsTable tbody');
    tbody.innerHTML = "";

    const sample = [
        {name:"Ali", corp:"11111", status:"Pending"},
        {name:"Omar", corp:"22222", status:"Approved"}
    ];

    sample.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.name}</td>
            <td>${r.corp}</td>
            <td>${r.status}</td>
        `;
        tbody.appendChild(tr);
    });
}

// AUTO LOGIN CHECK
if(localStorage.getItem('currentSupervisor')){
    showDashboard();
}
</script>

<footer>
© 2026 HMCAS Support Service Production
</footer>

</body>
</html>
