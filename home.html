<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Your existing styles */
    </style>
</head>
<body>
<div class="header-logos">
    <img src="logo1.png" alt="Logo 1">
    <img src="logo2.png" alt="Logo 2">
</div>

<!-- Login Page -->
<div id="loginPage">
    <!-- Login Form -->
</div>

<!-- Dashboard Page -->
<div id="dashboardPage">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 id="managerName"></h2>
        <button onclick="logout()" style="background:#f44336;color:#fff;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;">Logout</button>
    </div>

    <!-- Filters -->
    <div class="top-bar">
        <div>
            <label>Date From:</label><input type="date" id="filterFrom">
            <label>To:</label><input type="date" id="filterTo">
            <label>Hub:</label>
            <select id="filterHub">
                <option value="">All</option>
                <option>Hub 1</option><option>Hub 2</option><option>Hub 3</option>
                <option>Hub 4</option><option>Hub 5</option><option>Hub 6</option>
                <option>Hub 7</option><option>Hub 8</option>
                <option>Events</option><option>SAS</option><option>Retrieval</option>
                <option>Life Flight</option><option>Others</option>
            </select>
            <label>Status:</label>
            <select id="filterStatus">
                <option value="">All</option><option>Pending</option><option>Approved</option><option>Rejected</option>
            </select>
            <label>Shift:</label>
            <select id="filterShift" onchange="loadTable()">
                <option value="">All</option>
                <option>Day</option>
                <option>Peak</option>
                <option>Night</option>
                <option>Event</option>
            </select>
            <label>Search:</label>
            <input type="text" id="filterSearch" placeholder="Name, Corp, Unit, Shift, Type of Duty, Trip" oninput="loadTable()">
            <button onclick="loadTable()">Filter</button>
            <button class="clear-filters-btn" onclick="clearFilters()">Clear Filters</button>
        </div>
        <button onclick="exportToExcel()">Export Excel</button>
    </div>

    <div class="table-container">
        <table id="requestsTable">
            <thead>
                <tr>
                    <th>Date Submitted</th><th>Late Call Date</th><th>Name</th><th>Corp Number</th>
                    <th>Hub</th><th>Unit</th><th>Shift</th>
                    <th>Trip</th><th>Time Out</th><th>Type of Duty</th>
                    <th>Status</th><th>Action</th><th>Processed By</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { getLateCalls, updateRequestStatus } from './firebase.js';

    // Supervisor accounts initialization
    const supervisorsInit = [
        {username:"jcamins", fullName:"James Camins", corp:"45357", password:"HMCAS1234"},
        {username:"hkerkeni", fullName:"Habib Kerkeni", corp:"11748", password:"HMCAS1234"}
    ];
    localStorage.setItem('supervisors', JSON.stringify(supervisorsInit));

    // Show/Hide password
    function togglePassword(){
        const pwd = document.getElementById('password');
        pwd.type = pwd.type==="password"?"text":"password";
    }

    // Login function
    function login(){
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        let supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];
        const sup = supervisors.find(s=>s.username===username && s.password===password);
        if(sup){
            localStorage.setItem('currentSupervisor', JSON.stringify(sup));
            if(document.getElementById('savePassword').checked){
                localStorage.setItem('savedPassword', password);
            } else { localStorage.removeItem('savedPassword'); }
            checkLogin();
        } else {
            document.getElementById('errorMessage').innerText="Invalid username or password!";
        }
    }

    // Forgot password
    function forgotPassword(){
        const username = prompt("Enter your username to reset password:");
        if(!username) return;
        let supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];
        const supIndex = supervisors.findIndex(s=>s.username===username);
        if(supIndex===-1){ alert("Username not found!"); return; }
        const newPwd = prompt("Enter new password:"); if(!newPwd) return;
        supervisors[supIndex].password=newPwd;
        localStorage.setItem('supervisors', JSON.stringify(supervisors));
        alert("Password reset successfully!");
    }

    // Logout
    function logout(){
        localStorage.removeItem('currentSupervisor');
        document.getElementById('loginPage').style.display='flex';
        document.getElementById('dashboardPage').style.display='none';
        document.getElementById('username').value='';
        document.getElementById('password').value='';
        document.getElementById('errorMessage').innerText='';
        document.querySelector('#requestsTable tbody').innerHTML='';
    }

    // Check login
    function checkLogin(){
        const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
        if(sup){
            document.getElementById('loginPage').style.display='none';
            document.getElementById('dashboardPage').style.display='block';
            document.getElementById('managerName').innerText = `${sup.fullName} CN ${sup.corp}`;
            loadTable();
            startInactivityTimer();
        }
    }

    // Load table (status coloring fixed)
    async function loadTable(){
        const data = await getLateCalls();
        const tbody = document.querySelector('#requestsTable tbody');
        tbody.innerHTML = '';
        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;
        const hub = document.getElementById('filterHub').value;
        const statusFilter = document.getElementById('filterStatus').value;
        const shiftFilter = document.getElementById('filterShift').value;
        const search = document.getElementById('filterSearch').value.toLowerCase();

        let rows = [];

        data.forEach(r => {
            const d = new Date(r.dateSubmitted); 

            if (isNaN(d.getTime())) {
                console.error("Invalid date:", r.dateSubmitted);
                return;
            }

            const lateCallDate = new Date(r.lateCallDate); 

            let include = true;
            if(from && new Date(from) > d) include = false;
            if(to && new Date(to) < d) include = false;
            if(hub && r.hub !== hub) include = false;
            if(statusFilter && r.status !== statusFilter) include = false;
            if(shiftFilter && r.shift !== shiftFilter) include = false;
            if(search && !(`${r.name} ${r.corp} ${r.unit} ${r.shift} ${r.typeOfDuty} ${r.trip}`.toLowerCase().includes(search))) include = false;

            if(include){
                const statusNormalized = (r.status || "").trim().toLowerCase();
                const statusClass = statusNormalized === "pending" ? "status-pending" :
                                    statusNormalized === "approved" ? "status-approved" :
                                    statusNormalized === "rejected" ? "status-rejected" : "";

                const actionButtons = statusNormalized === "pending" ? 
                    `<button class="action-btn" style="background:#4CAF50;color:#fff;" onclick="approve('${r.id}')">✔</button>
                    <button class="action-btn" style="background:#f44336;color:#fff;" onclick="reject('${r.id}')">✖</button>` 
                 : "";

                const formattedDate = d.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: '2-digit' 
                });

                const formattedTime = d.toLocaleTimeString('en-GB', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });

                const formattedDateTime = `${formattedDate} ${formattedTime}`;

                const formattedLateCallDate = lateCallDate.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: '2-digit' 
                });

                const tr = document.createElement('tr');
                tr.innerHTML = ` 
                    <td>${formattedDateTime}</td>
                    <td>${formattedLateCallDate}</td>
                    <td>${r.name}</td>
                    <td>${r.corp}</td>
                    <td>${r.hub}</td>
                    <td>${r.unit}</td>
                    <td>${r.shift}</td>
                    <td>${r.trip}</td>
                    <td>${r.timeout}</td>
                    <td>${r.typeOfDuty}</td>
                    <td class="${statusClass}">${r.status}</td>
                    <td>${actionButtons}</td>
                    <td>${r.processedBy || ''}</td>
                `;
                rows.push(tr);
            }
        });

        rows.sort((a, b) => {
            const dateA = new Date(a.cells[0].innerText);  
            const dateB = new Date(b.cells[0].innerText);  
            return dateB - dateA; 
        });

        rows.forEach(row => tbody.appendChild(row));
    }

    // Export to Excel
    function exportToExcel(){
        const table=document.getElementById('requestsTable');
        const rows=table.querySelectorAll('tr');
        const csvContent = Array.from(rows)
            .map(r=>Array.from(r.querySelectorAll('th,td')).map(c=>c.innerText).join(",")) 
            .join("\n");
        const blob = new Blob([csvContent],{type:"text/csv;charset=utf-8;"}); 
        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download="dashboard_export.csv";
        link.click();
    }

    // Inactivity auto logout
    let inactivityTimer;
    function startInactivityTimer(){
        resetInactivityTimer();
        document.onclick = resetInactivityTimer;
        document.onmousemove = resetInactivityTimer;
        document.onkeypress = resetInactivityTimer;
    }

    function resetInactivityTimer(){
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => { 
            alert("Logged out due to inactivity"); 
            logout(); 
        }, 5 * 60 * 1000);
    }

    // Allow Enter key login
    document.getElementById('password').addEventListener('keydown', e => {
        if(e.key === 'Enter'){ login(); }
    });

    // Add event listeners for filtering by hub and status
    document.getElementById('filterHub').addEventListener('change', loadTable);
    document.getElementById('filterStatus').addEventListener('change', loadTable);

    // Initial check
    checkLogin();

    // Expose functions to HTML
    window.logout = logout;
    window.loadTable = loadTable;
    window.exportToExcel = exportToExcel;
    window.approve = approve;
    window.reject = reject;
    window.forgotPassword = forgotPassword;
    window.togglePassword = togglePassword;
    window.login = login;
    document.getElementById('loginBtn').onclick = login;
</script>

<footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
</footer>

</body>
</html>
