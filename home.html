<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Styling for the page (same as before) */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #eef2f3, #ffffff);
            color: #333;
        }
        /* Other styles ... */
    </style>
</head>
<body>
    <div class="header-logos">
        <img src="logo1.png" alt="Logo 1">
        <img src="logo2.png" alt="Logo 2">
    </div>

    <!-- Login Page -->
    <div id="loginPage">
        <div class="login-container">
            <h2>Supervisor Login</h2>
            <input type="text" id="username" placeholder="Username">
            <div style="position:relative;">
                <input type="password" id="password" placeholder="Password">
                <span style="position:absolute;right:10px;top:12px;cursor:pointer;" onclick="togglePassword()">👁️</span>
            </div>
            <div class="remember-me">
                <label>
                    Remember Me
                    <input type="checkbox" id="savePassword">
                </label>
            </div>
            <button id="loginBtn">Login</button>
            <div id="errorMessage" class="error-message"></div>
            <div class="forgot-password">
                <a onclick="forgotPassword()">Forgot Password?</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboardPage" style="display: none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h2 id="managerName"></h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- Filters -->
        <div class="top-bar">
            <div>
                <label>Date From:</label><input type="date" id="filterFrom">
                <label>To:</label><input type="date" id="filterTo">
                <label>Hub:</label>
                <select id="filterHub">
                    <option value="">All</option><option>Hub 1</option><option>Hub 2</option>
                    <option>Hub 3</option><option>Hub 4</option><option>Hub 5</option>
                </select>
                <label>Status:</label>
                <select id="filterStatus">
                    <option value="">All</option><option>Pending</option><option>Approved</option><option>Rejected</option>
                </select>
                <button onclick="loadTable()">Filter</button>
                <button class="clear-filters-btn" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>Date Submitted</th>
                        <th>Late Call Date</th>
                        <th>Name</th>
                        <th>Hub</th>
                        <th>Status</th>
                        <th>Action</th>
                        <th>Processed By</th>
                        <th>Rejection Reason</th> <!-- New column for rejection reason -->
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Simulate getting data from a database or API
        const data = [
            {id: 1, dateSubmitted: '2023-03-01', lateCallDate: '2023-03-02', name: 'John Doe', hub: 'Hub 1', status: 'Pending', processedBy: 'Admin', rejectionReason: ''},
            {id: 2, dateSubmitted: '2023-03-05', lateCallDate: '2023-03-06', name: 'Jane Smith', hub: 'Hub 2', status: 'Approved', processedBy: 'Admin', rejectionReason: ''},
            {id: 3, dateSubmitted: '2023-03-10', lateCallDate: '2023-03-12', name: 'Sam Harris', hub: 'Hub 1', status: 'Rejected', processedBy: 'Admin', rejectionReason: 'Late arrival'},
            // More sample data
        ];

        // Show/Hide password
        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === "password" ? "text" : "password";
        }

        // Filter and display table
        function loadTable() {
            const tbody = document.querySelector('#requestsTable tbody');
            tbody.innerHTML = '';  // Clear the table

            const from = document.getElementById('filterFrom').value;
            const to = document.getElementById('filterTo').value;
            const hub = document.getElementById('filterHub').value;
            const status = document.getElementById('filterStatus').value;

            let filteredData = data.filter(row => {
                // Apply filters
                let match = true;

                // Date filters
                if (from && new Date(row.dateSubmitted) < new Date(from)) match = false;
                if (to && new Date(row.dateSubmitted) > new Date(to)) match = false;

                // Hub filter
                if (hub && row.hub !== hub) match = false;

                // Status filter
                if (status && row.status !== status) match = false;

                return match;
            });

            // Populate table with filtered data
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.dateSubmitted}</td>
                    <td>${row.lateCallDate}</td>
                    <td>${row.name}</td>
                    <td>${row.hub}</td>
                    <td>${row.status}</td>
                    <td>
                        <button onclick="approve('${row.id}')">Approve</button>
                        <button onclick="reject('${row.id}')">Reject</button>
                    </td>
                    <td>${row.processedBy}</td>
                    <td>${row.rejectionReason || 'N/A'}</td> <!-- Show rejection reason if available -->
                `;
                tbody.appendChild(tr);
            });
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            document.getElementById('filterHub').value = '';
            document.getElementById('filterStatus').value = '';
            loadTable();
        }

        // Approve a request
        function approve(id) {
            const row = data.find(r => r.id === id);
            if (row) {
                row.status = 'Approved';
                row.processedBy = 'Admin';  // Example - set the processedBy to the logged-in user
                loadTable();  // Refresh the table
            }
        }

        // Reject a request
        function reject(id) {
            const reason = prompt('Please provide a rejection reason:');
            if (reason) {
                const row = data.find(r => r.id === id);
                if (row) {
                    row.status = 'Rejected';
                    row.rejectionReason = reason;
                    row.processedBy = 'Admin';  // Example - set the processedBy to the logged-in user
                    loadTable();  // Refresh the table
                }
            }
        }

        // Initial table load
        loadTable();
    </script>
</body>
</html>
