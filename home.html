<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager's View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #eef2f3, #ffffff);
            padding-bottom: 60px;
        }

        .header {
            background: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left img,
        .header-right img {
            height: 50px;
            object-fit: contain;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            padding: 20px;
        }

        .manager-info {
            margin-top: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .manager-info h2 {
            margin: 0;
        }

        .manager-info p {
            margin: 5px 0;
            font-weight: 600;
            font-size: 14px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #555;
        }

        .card p {
            font-size: 24px;
            font-weight: 700;
            margin-top: 5px;
        }

        .charts {
            margin-top: 30px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            background: #fff;
            padding: 10px 0;
            font-size: 12px;
            color: #555;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-left">
            <img src="logo1.png" alt="Logo 1">
            <img src="logo2.png" alt="Logo 2">
        </div>
        <div class="header-right">
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="manager-info">
            <h2 id="managerName">Manager Name</h2>
            <p id="managerCorp">Corp Number</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Requests</h3>
                <p id="totalRequests">0</p>
            </div>
            <div class="card">
                <h3>Approved Requests</h3>
                <p id="approvedRequests">0</p>
            </div>
            <div class="card">
                <h3>Pending Requests</h3>
                <p id="pendingRequests">0</p>
            </div>
            <div class="card">
                <h3>Rejected Requests</h3>
                <p id="rejectedRequests">0</p>
            </div>
            <div class="card">
                <h3>Total Late Hours</h3>
                <p id="totalLateHours">0</p>
            </div>
        </div>

        <div class="charts">
            <canvas id="statusChart"></canvas>
            <canvas id="hubChart"></canvas>
            <canvas id="shiftChart"></canvas>
            <canvas id="trendChart"></canvas>
        </div>
    </div>

    <footer>
        © 2026 HMCAS Support Service Production.<br>
        James Ross Camins. All rights reserved.
    </footer>

    <script>
        const managers = [
            { username: "manager1", fullName: "Manager One", corp: "12345", password: "managerpass1" },
            { username: "manager2", fullName: "Manager Two", corp: "67890", password: "managerpass2" }
        ];

        function displayManagerInfo() {
            const manager = JSON.parse(localStorage.getItem('currentManager'));
            if (manager) {
                document.getElementById('managerName').innerText = `${manager.fullName}`;
                document.getElementById('managerCorp').innerText = `Corp: ${manager.corp}`;
            } else {
                window.location.href = 'login.html'; // Redirect if no valid session
            }
        }

        function logout() {
            localStorage.removeItem('currentManager');
            window.location.href = 'login.html'; // Redirect to login page
        }

        displayManagerInfo();
    </script>
</body>

</html>
