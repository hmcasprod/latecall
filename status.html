<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Dashboard - Table Only</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #eef2f3, #ffffff);
      padding-bottom: 60px;
    }

    .header {
      background: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left img,
    .header-right img {
      height: 50px;
      object-fit: contain;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .filter-box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input,
    select {
      padding: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
      font-size: 13px;
    }

    th {
      background: #f2f2f2;
    }

    .status-approved {
      background: #4CAF50;
      color: white;
    }

    .status-pending {
      background: #FFD700;
    }

    .status-rejected {
      background: #f44336;
      color: white;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 600px) {
      .filter-box {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <img src="logo1.png" alt="Logo 1">
    </div>
    <div class="header-right">
      <img src="logo2.png" alt="Logo 2">
    </div>
  </div>

  <div class="container">
    <div class="filter-box">
      <input type="text" id="corpSearch" placeholder="Enter Corporation Number">
      <input type="date" id="dateSearch">
      <button id="searchBtn">Search</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div class="table-box">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Late Call Date</th>
            <th>Hub</th>
            <th>Unit</th>
            <th>Shift</th>
            <th>Late Hours</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const corpInput = document.getElementById("corpSearch");
    const dateInput = document.getElementById("dateSearch");
    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const tbody = document.querySelector("#dataTable tbody");

    // Format date to "08 Mar 2026"
    function formatDateToString(dateStr) {
      const options = { day: '2-digit', month: 'short', year: 'numeric' };
      return new Date(dateStr).toLocaleDateString('en-GB', options);
    }

    async function fetchData() {
      tbody.innerHTML = "";
      const corp = corpInput.value.trim();
      const date = dateInput.value;

      if (!corp || !date) {
        alert("Please enter Corporation Number and Date.");
        return;
      }

      const formattedDate = formatDateToString(date);

      try {
        const lateCallsCol = collection(db, "lateCalls");
        const q = query(
          lateCallsCol,
          where("corp", "==", corp),
          where("lateCallDate", "==", formattedDate)
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="6">No records found.</td></tr>`;
          return;
        }

        snapshot.docs.forEach(doc => {
          const r = doc.data();
          const tr = document.createElement("tr");

          let statusClass = "";
          switch ((r.status || "").toLowerCase()) {
            case "approved": statusClass = "status-approved"; break;
            case "pending": statusClass = "status-pending"; break;
            case "rejected": statusClass = "status-rejected"; break;
          }

          tr.innerHTML = `
            <td>${r.lateCallDate || ''}</td>
            <td>${r.hub || ''}</td>
            <td>${r.unit || ''}</td>
            <td>${r.shift || ''}</td>
            <td>${r.lateCallHours || ''}</td>
            <td class="${statusClass}">${r.status || ''}</td>
          `;

          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        alert("Error fetching data. Check console for details.");
      }
    }

    searchBtn.addEventListener("click", fetchData);
    clearBtn.addEventListener("click", () => {
      corpInput.value = "";
      dateInput.value = "";
      tbody.innerHTML = "";
    });
  </script>
</body>
</html>
