<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Late Call Search Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #eef2f3, #ffffff);
      padding-bottom: 60px;
    }

    .header {
      background: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }

    .header-left img,
    .header-right img {
      height: 50px;
      object-fit: contain;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .filter-box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
      font-size: 13px;
    }

    th {
      background: #f2f2f2;
    }

    .status-approved {
      background: #4CAF50;
      color: white;
    }

    .status-pending {
      background: #FFD700;
    }

    .status-rejected {
      background: #f44336;
      color: white;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 600px) {
      .filter-box {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <img src="logo1.png" alt="Logo 1">
      <span>HMCAS Late Call Dashboard</span>
    </div>
    <div class="header-right">
      <img src="logo2.png" alt="Logo 2">
    </div>
  </div>

  <div class="container">

    <!-- FILTERS -->
    <div class="filter-box">
      <label>From:</label>
      <input type="date" id="startDate">
      <label>To:</label>
      <input type="date" id="endDate">

      <input type="text" id="corpSearch" placeholder="Search Corporation Number">

      <button id="resetFilters">Reset Filters</button>
    </div>

    <!-- TABLE -->
    <div class="chart-box">
      <h3>Requests Table</h3>
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date Submitted</th>
            <th>Late Call Date</th>
            <th>Name</th>
            <th>Corp</th>
            <th>Hub</th>
            <th>Shift</th>
            <th>Late Hours</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
  </footer>

  <script type="module">
    import { getLateCalls } from './firebase.js';

    let allRequests = [];

    function formatDateTime(dateStr) {
      const d = new Date(dateStr);
      const day = String(d.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[d.getMonth()];
      const year = String(d.getFullYear()).slice(2);
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${day} ${month} ${year} ${hours}:${minutes}`;
    }

    function formatDateOnly(dateStr) {
      const d = new Date(dateStr);
      const day = String(d.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[d.getMonth()];
      const year = String(d.getFullYear()).slice(2);
      return `${day} ${month} ${year}`;
    }

    async function loadData() {
      try {
        allRequests = await getLateCalls();
        filterDashboard();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    function filterDashboard() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const corpSearch = document.getElementById("corpSearch").value.toLowerCase();

      let data = [...allRequests];

      if (corpSearch) data = data.filter(r => (r.corp || "").toString().includes(corpSearch));
      if (startDate) data = data.filter(r => new Date(r.dateSubmitted) >= new Date(startDate));
      if (endDate) data = data.filter(r => new Date(r.dateSubmitted) <= new Date(endDate + "T23:59:59"));

      updateTable(data);
    }

    function updateTable(data) {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";
      data.forEach(r => {
        const tr = document.createElement("tr");
        let statusClass = "";
        const status = (r.status || "").toLowerCase();
        if (status === "approved") statusClass = "status-approved";
        if (status === "pending") statusClass = "status-pending";
        if (status === "rejected") statusClass = "status-rejected";
        tr.innerHTML = `
          <td>${formatDateTime(r.dateSubmitted)}</td>
          <td>${r.lateCallDate ? formatDateOnly(r.lateCallDate) : ""}</td>
          <td>${r.name}</td>
          <td>${r.corp}</td>
          <td>${r.hub}</td>
          <td>${r.shift}</td>
          <td>${r.lateHours || 0}</td>
          <td class="${statusClass}">${r.status}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("corpSearch").addEventListener("input", filterDashboard);
    document.getElementById("startDate").addEventListener("change", filterDashboard);
    document.getElementById("endDate").addEventListener("change", filterDashboard);
    document.getElementById("resetFilters").addEventListener("click", () => {
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
      document.getElementById("corpSearch").value = "";
      filterDashboard();
    });

    loadData();
  </script>

</body>

</html>
