<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:'Inter',sans-serif;margin:0;background:linear-gradient(to right,#eef2f3,#ffffff);padding-bottom:60px;}
.header{background:white;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.header img{height:50px;}
.container{max-width:1300px;margin:auto;padding:20px;}
.filter-box{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px;}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);text-align:center;}
.chart-box{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px;}
th{background:#f2f2f2;}
button{padding:6px 12px;border:none;background:#4CAF50;color:white;border-radius:6px;cursor:pointer;}
</style>
</head>

<body>

<div class="header">
  <img src="logo1.png">
  <img src="logo2.png">
</div>

<div class="container" id="dashboard">

<div class="filter-box no-print">
  <button onclick="exportDashboardPDF()">Export PDF</button>
</div>

<div class="cards">
  <div class="card"><h3>Total</h3><p id="total">10</p></div>
  <div class="card"><h3>Approved</h3><p id="approved">5</p></div>
  <div class="card"><h3>Pending</h3><p id="pending">3</p></div>
  <div class="card"><h3>Rejected</h3><p id="rejected">2</p></div>
</div>

<div class="chart-box">
  <canvas id="statusChart"></canvas>
</div>

<div class="chart-box">
<table>
<thead>
<tr>
<th>Name</th>
<th>Hub</th>
<th>Status</th>
</tr>
</thead>
<tbody>
<tr><td>John</td><td>Hub 1</td><td>Approved</td></tr>
<tr><td>Ali</td><td>Hub 2</td><td>Pending</td></tr>
</tbody>
</table>
</div>

</div>

<script>

// SAMPLE CHART
new Chart(document.getElementById("statusChart"), {
  type: "doughnut",
  data: {
    labels: ["Approved", "Pending", "Rejected"],
    datasets: [{
      data: [5, 3, 2],
      backgroundColor: ["#4CAF50", "#FFD700", "#f44336"]
    }]
  }
});


// ✅ FIXED PDF EXPORT
async function exportDashboardPDF(){

  const { jsPDF } = window.jspdf;

  const element = document.getElementById("dashboard");

  // Hide buttons
  document.querySelectorAll(".no-print").forEach(el => el.style.display = "none");

  const canvas = await html2canvas(element, {
    scale: 2,
    useCORS: true,
    scrollY: -window.scrollY
  });

  const imgData = canvas.toDataURL("image/png");

  const pdf = new jsPDF("p", "mm", "a4");

  const pageWidth = 210;
  const pageHeight = 297;

  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;

  let heightLeft = imgHeight;
  let position = 0;

  // First page
  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  // Extra pages
  while (heightLeft > 0) {
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  pdf.save("dashboard.pdf");

  // Show buttons again
  document.querySelectorAll(".no-print").forEach(el => el.style.display = "flex");
}

</script>

</body>
</html>
