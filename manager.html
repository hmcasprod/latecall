```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manager Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:'Inter',sans-serif;
margin:0;
background:linear-gradient(to right,#eef2f3,#ffffff);
padding-bottom:60px;
}

.header{
background:white;
padding:10px 20px;
display:flex;
align-items:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.header img{
height:50px;
margin-right:10px;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.manager-info{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
text-align:center;
margin-bottom:20px;
}

.filter-box{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
margin-bottom:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
text-align:center;
}

.card p{
font-size:24px;
font-weight:700;
margin:5px 0 0;
}

.charts{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-bottom:20px;
}

.chart-box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
}

button{
padding:6px 12px;
border:none;
background:#4CAF50;
color:white;
border-radius:6px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:6px;
text-align:center;
font-size:13px;
}

th{
background:#f2f2f2;
}

.status-approved{background:#4CAF50;color:white;}
.status-pending{background:#FFD700;}
.status-rejected{background:#f44336;color:white;}

footer{
position:fixed;
bottom:0;
width:100%;
background:#fff;
text-align:center;
padding:8px;
font-size:12px;
}

</style>

</head>

<body>

<div class="header">
<img src="logo1.png">
<img src="logo2.png">
</div>

<div class="container">

<div class="manager-info">
<h2>Manager's View</h2>
<p id="managerName"></p>
</div>

<div class="filter-box">

<label>Hub:</label>
<select id="hubSelector">
<option value="">All</option>
<option>Hub 1</option>
<option>Hub 2</option>
<option>Hub 3</option>
<option>Hub 4</option>
<option>Hub 5</option>
<option>Hub 6</option>
<option>Hub 7</option>
<option>Hub 8</option>
<option>Events</option>
<option>SAS</option>
<option>Retrieval</option>
<option>Life Flight</option>
</select>

<label>Date:</label>
<select id="dateFilter">
<option value="all">All</option>
<option value="today">Today</option>
<option value="week">Last 7 Days</option>
<option value="month">This Month</option>
</select>

<input type="text" id="staffSearch" placeholder="Search Name / Corp">

<button onclick="exportDashboardPDF()">Export PDF</button>

</div>

<div class="cards">

<div class="card"><h3>Total</h3><p id="total">0</p></div>

<div class="card"><h3>Approved</h3><p id="approved">0</p></div>

<div class="card"><h3>Pending</h3><p id="pending">0</p></div>

<div class="card"><h3>Rejected</h3><p id="rejected">0</p></div>

<div class="card"><h3>Late Hours</h3><p id="lateHours">0</p></div>

</div>

<div class="charts">

<div class="chart-box">
<h3>Status</h3>
<canvas id="statusChart"></canvas>
</div>

<div class="chart-box">
<h3>Hub Requests</h3>
<canvas id="hubChart"></canvas>
</div>

<div class="chart-box">
<h3>Shift Requests</h3>
<canvas id="shiftChart"></canvas>
</div>

<div class="chart-box">
<h3>Trend</h3>
<canvas id="trendChart"></canvas>
</div>

</div>

<div class="chart-box">

<h3>Requests Table</h3>

<table id="dataTable">

<thead>
<tr>
<th>Date</th>
<th>Name</th>
<th>Corp</th>
<th>Hub</th>
<th>Shift</th>
<th>Late Hours</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<footer>
© 2026 HMCAS Support Service Production
</footer>

<script type="module">

import { getLateCalls } from './firebase.js';

let allRequests=[];

let statusChart,hubChart,shiftChart,trendChart;

async function loadData(){

allRequests = await getLateCalls();

filterDashboard();

}

function filterDashboard(){

const hub=document.getElementById("hubSelector").value;

const dateFilter=document.getElementById("dateFilter").value;

const search=document.getElementById("staffSearch").value.toLowerCase();

let data=[...allRequests];

if(hub){
data=data.filter(r=>r.hub===hub);
}

if(search){
data=data.filter(r=>
(r.name||"").toLowerCase().includes(search) ||
(r.corp||"").toString().includes(search)
);
}

if(dateFilter!=="all"){

const today=new Date();

data=data.filter(r=>{

const d=new Date(r.dateSubmitted);

if(dateFilter==="today"){
return d.toDateString()===today.toDateString();
}

if(dateFilter==="week"){
const lastWeek=new Date();
lastWeek.setDate(today.getDate()-7);
return d>=lastWeek;
}

if(dateFilter==="month"){
return d.getMonth()===today.getMonth() &&
d.getFullYear()===today.getFullYear();
}

});

}

updateDashboard(data);

}

function updateDashboard(data){

let approved=0,pending=0,rejected=0,late=0;

const hubs={},shifts={},dates={};

data.forEach(r=>{

const status=(r.status||"").toLowerCase();

if(status==="approved")approved++;
if(status==="pending")pending++;
if(status==="rejected")rejected++;

late+=parseFloat(r.lateHours||0);

hubs[r.hub]=(hubs[r.hub]||0)+1;

shifts[r.shift]=(shifts[r.shift]||0)+1;

const d=new Date(r.dateSubmitted).toLocaleDateString();

dates[d]=(dates[d]||0)+1;

});

document.getElementById("total").innerText=data.length;

document.getElementById("approved").innerText=approved;

document.getElementById("pending").innerText=pending;

document.getElementById("rejected").innerText=rejected;

document.getElementById("lateHours").innerText=late.toFixed(2);

createStatusChart(approved,pending,rejected);

createHubChart(hubs);

createShiftChart(shifts);

createTrendChart(dates);

updateTable(data);

}

function updateTable(data){

const tbody=document.querySelector("#dataTable tbody");

tbody.innerHTML="";

data.forEach(r=>{

const tr=document.createElement("tr");

let statusClass="";

const status=(r.status||"").toLowerCase();

if(status==="approved")statusClass="status-approved";

if(status==="pending")statusClass="status-pending";

if(status==="rejected")statusClass="status-rejected";

tr.innerHTML=`
<td>${new Date(r.dateSubmitted).toLocaleString()}</td>
<td>${r.name}</td>
<td>${r.corp}</td>
<td>${r.hub}</td>
<td>${r.shift}</td>
<td>${r.lateHours||0}</td>
<td class="${statusClass}">${r.status}</td>
`;

tbody.appendChild(tr);

});

}

function createStatusChart(a,p,r){

if(statusChart)statusChart.destroy();

statusChart=new Chart(document.getElementById("statusChart"),{

type:"doughnut",

data:{
labels:["Approved","Pending","Rejected"],
datasets:[{data:[a,p,r],backgroundColor:["#4CAF50","#FFD700","#f44336"]}]
}

});

}

function createHubChart(data){

if(hubChart)hubChart.destroy();

hubChart=new Chart(document.getElementById("hubChart"),{

type:"bar",

data:{
labels:Object.keys(data),
datasets:[{data:Object.values(data),backgroundColor:"#2196F3"}]
},

options:{
onClick:(e,el)=>{
if(el.length){

const hub=Object.keys(data)[el[0].index];

document.getElementById("hubSelector").value=hub;

filterDashboard();

}
}
}

});

}

function createShiftChart(data){

if(shiftChart)shiftChart.destroy();

shiftChart=new Chart(document.getElementById("shiftChart"),{

type:"pie",

data:{
labels:Object.keys(data),
datasets:[{data:Object.values(data)}]
}

});

}

function createTrendChart(data){

if(trendChart)trendChart.destroy();

trendChart=new Chart(document.getElementById("trendChart"),{

type:"line",

data:{
labels:Object.keys(data),
datasets:[{
label:"Requests",
data:Object.values(data),
borderColor:"#4CAF50",
tension:0.3
}]
}

});

}

async function exportDashboardPDF(){

const { jsPDF } = window.jspdf;

const canvas=await html2canvas(document.querySelector(".container"));

const img=canvas.toDataURL("image/png");

const pdf=new jsPDF("landscape");

pdf.addImage(img,"PNG",10,10,280,150);

pdf.save("dashboard.pdf");

}

document.getElementById("hubSelector").addEventListener("change",filterDashboard);

document.getElementById("dateFilter").addEventListener("change",filterDashboard);

document.getElementById("staffSearch").addEventListener("input",filterDashboard);

loadData();

</script>

</body>
</html>
```
