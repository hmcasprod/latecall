<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.10.0/dist/pptxgen.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #eef2f3, #ffffff);
      padding-bottom: 60px;
    }

    .header {
      background: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .card p {
      font-size: 24px;
      font-weight: 700;
      margin: 5px 0 0;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }

    .export-buttons {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <img src="logo1.png" alt="Logo 1">
    </div>
    <div class="header-right">
      <img src="logo2.png" alt="Logo 2">
    </div>
  </div>

  <div class="container">

    <!-- Export Buttons -->
    <div class="export-buttons">
      <button onclick="exportReportPDF()">Export PDF</button>
      <button onclick="exportDashboardCSV()">Export CSV</button>
      <button onclick="exportReportPPT()">Export PowerPoint</button>
    </div>

    <!-- Cards Section -->
    <div class="cards">
      <div class="card" data-status=""><h3>Total</h3><p id="total">0</p></div>
      <div class="card" data-status="approved"><h3>Approved</h3><p id="approved">0</p></div>
      <div class="card" data-status="pending"><h3>Pending</h3><p id="pending">0</p></div>
      <div class="card" data-status="rejected"><h3>Rejected</h3><p id="rejected">0</p></div>
      <div class="card"><h3>Late Hours</h3><p id="lateHours">0</p></div>
    </div>

    <!-- Charts Section -->
    <div class="charts">
      <div class="chart-box"><h3>Status</h3><canvas id="statusChart"></canvas></div>
      <div class="chart-box"><h3>Hub Requests</h3><canvas id="hubChart"></canvas></div>
      <div class="chart-box"><h3>Shift Requests</h3><canvas id="shiftChart"></canvas></div>
      <div class="chart-box"><h3>Trend</h3><canvas id="trendChart"></canvas></div>
    </div>

    <!-- Requests Table -->
    <div class="chart-box">
      <h3>Requests Table</h3>
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date Submitted</th>
            <th>Late Call Date</th>
            <th>Name</th>
            <th>Corp</th>
            <th>Hub</th>
            <th>Shift</th>
            <th>Late Hours</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
  </footer>

  <script type="module">
    import { getLateCalls } from './firebase.js'; // Assume this function exists and loads the data

    let allRequests = [];
    let statusChart, hubChart, shiftChart, trendChart;

    async function loadData() {
      try {
        allRequests = await getLateCalls();
        filterDashboard();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    // Function to Export PDF Report
    async function exportReportPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "mm", "a4");

      // Add title page
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(20);
      pdf.text("Dashboard Report", 105, 40, { align: "center" });
      pdf.setFontSize(12);
      pdf.text("Date Generated: " + new Date().toLocaleDateString(), 105, 50, { align: "center" });
      pdf.addPage();

      // Add Dashboard Overview (capture container)
      const container = document.querySelector(".container");
      const canvas = await html2canvas(container, { scale: 2 });
      const imgData = canvas.toDataURL("image/png");

      pdf.addImage(imgData, 'PNG', 10, 20, 180, 140); // Adjust position and size
      pdf.addPage();

      // Add Charts Section
      pdf.setFontSize(14);
      pdf.text("Charts Overview", 10, 20);
      pdf.addImage(document.getElementById("statusChart").toDataURL(), 'PNG', 10, 30, 180, 140);
      pdf.addImage(document.getElementById("hubChart").toDataURL(), 'PNG', 10, 160, 180, 140);
      pdf.addPage();

      // Add Trend and Shift Charts
      pdf.addImage(document.getElementById("shiftChart").toDataURL(), 'PNG', 10, 20, 180, 140);
      pdf.addImage(document.getElementById("trendChart").toDataURL(), 'PNG', 10, 160, 180, 140);
      pdf.addPage();

      // Add Data Table Section
      const table = document.getElementById("dataTable");
      const tableCanvas = await html2canvas(table, { scale: 2 });
      const tableImgData = tableCanvas.toDataURL("image/png");
      pdf.addImage(tableImgData, 'PNG', 10, 20, 180, 140);
      pdf.addPage();

      // Add Summary Section
      pdf.setFontSize(16);
      pdf.text("Summary", 10, 20);
      pdf.setFontSize(12);
      pdf.text("Key Insights: ", 10, 30);
      pdf.text("1. Approved requests have increased by X% over the past 30 days.", 10, 40);
      pdf.text("2. The hub with the highest number of requests is Hub X.", 10, 50);
      pdf.text("3. The trend for rejected requests shows an upward spike over the last week.", 10, 60);
      pdf.addPage();

      // Save the PDF
      pdf.save("Dashboard_Report.pdf");
    }

    // Export to CSV
    function exportDashboardCSV() {
      const table = document.getElementById("dataTable");
      const rows = table.querySelectorAll("tr");
      let csvContent = [];

      rows.forEach((row) => {
        let cols = row.querySelectorAll("th, td");
        let rowData = [];
        cols.forEach((col) => {
          rowData.push(col.textContent.trim());
        });
        csvContent.push(rowData.join(","));
      });

      const csvBlob = new Blob([csvContent.join("\n")], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(csvBlob);
      link.download = "dashboard_report.csv";
      link.click();
    }

    // Export to PowerPoint
    function exportReportPPT() {
      const pptx = new PptxGenJS();
      pptx.addSlide();
      pptx.addText("Dashboard Report", { x: 1, y: 1, fontSize: 36, fontFace: "Helvetica", color: "000000" });
      
      pptx.addSlide();
      pptx.addText("Summary", { x: 1, y: 1, fontSize: 28, fontFace: "Helvetica", color: "000000" });
      pptx.addText("1. Approved requests have increased by X%.", { x: 1, y: 2, fontSize: 20, fontFace: "Helvetica", color: "000000" });
      pptx.addText("2. Hub X has the most requests.", { x: 1, y: 2.5, fontSize: 20, fontFace: "Helvetica", color: "000000" });
      
      pptx.save("Dashboard_Report.pptx");
    }

    loadData();
  </script>

</body>

</html>
