<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* (unchanged styles) */
body{font-family:'Inter',sans-serif;margin:0;background:linear-gradient(to right,#eef2f3,#ffffff);padding-bottom:60px;}
.header{background:white;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);flex-wrap:wrap;}
.header-left, .header-right{display:flex;align-items:center;gap:10px;}
.header-left img, .header-right img{height:50px;object-fit:contain;}
.container{max-width:1300px;margin:auto;padding:20px;}
.filter-box{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px;}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);text-align:center;cursor:pointer;transition:0.2s;}
.card p{font-size:24px;font-weight:700;margin:5px 0 0;}
.card.active{border:2px solid #2196F3;transform:scale(1.05);}
.quick-date button{background:#2196F3;margin-right:5px;color:white;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;transition:0.2s;}
.quick-date button.active{border:2px solid #2196F3;transform:scale(1.05);}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px;}
.chart-box{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);}
button{padding:6px 12px;border:none;background:#4CAF50;color:white;border-radius:6px;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px;}
th{background:#f2f2f2;}
.status-approved{background:#4CAF50;color:white;}
.status-pending{background:#FFD700;}
.status-rejected{background:#f44336;color:white;}
footer{position:fixed;bottom:0;width:100%;background:#fff;text-align:center;padding:8px;font-size:12px;box-shadow:0 -2px 5px rgba(0,0,0,0.1);}
@media(max-width:600px){.filter-box,.quick-date{flex-direction:column;align-items:flex-start;}}
</style>
</head>

<body>

<div class="header">
  <div class="header-left">
    <img src="logo1.png">
  </div>
  <div class="header-right">
    <img src="logo2.png">
  </div>
</div>

<div class="container">

<div class="filter-box">
  <label>Hub:</label>
  <select id="hubSelector">
    <option value="">All</option>
    <option>Hub 1</option>
    <option>Hub 2</option>
    <option>Hub 3</option>
    <option>Hub 4</option>
    <option>Hub 5</option>
    <option>Hub 6</option>
    <option>Hub 7</option>
    <option>Hub 8</option>
    <option>Events</option>
    <option>SAS</option>
    <option>Retrieval</option>
    <option>Life Flight</option>
    <option>Others</option>
  </select>

  <input type="date" id="startDate">
  <input type="date" id="endDate">
  <input type="text" id="staffSearch" placeholder="Search Name / Corp">

  <button onclick="exportDashboardPDF()">Export PDF</button>
  <button id="resetFilters">Reset Filters</button>
</div>

<div class="charts">
<div class="chart-box"><h3>Hub Requests</h3><canvas id="hubChart"></canvas></div>
</div>

</div>

<script type="module">
import { getLateCalls } from './firebase.js';

let hubChart;
let allRequests=[];

async function loadData(){
  allRequests = await getLateCalls();
  updateDashboard(allRequests);
}

function updateDashboard(data){
  const hubs={};
  data.forEach(r=>{
    const hubName = ["Hub 1","Hub 2","Hub 3","Hub 4","Hub 5","Hub 6","Hub 7","Hub 8","Events","SAS","Retrieval","Life Flight"].includes(r.hub)? r.hub : "HUBS";
    hubs[hubName]=(hubs[hubName]||0)+1;
  });
  createHubChart(hubs);
}

function createHubChart(data){
  if(hubChart) hubChart.destroy();

  // ✅ ONLY CHANGE HERE
  const labels = Object.keys(data).map(k => k ? k : "HUBS");

  const values = Object.values(data);

  hubChart=new Chart(document.getElementById("hubChart"),{
    type:"bar",
    data:{ labels: labels, datasets:[{data: values, backgroundColor:"#2196F3"}] }
  });
}

loadData();
</script>

</body>
</html>
