<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:'Inter',sans-serif;margin:0;background:linear-gradient(to right,#eef2f3,#ffffff);padding-bottom:60px;}
.header{background:white;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);flex-wrap:wrap;}
.header-left, .header-right{display:flex;align-items:center;gap:10px;}
.header-left img, .header-right img{height:50px;object-fit:contain;}
.container{max-width:1300px;margin:auto;padding:20px;}
.filter-box{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px;}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);text-align:center;cursor:pointer;transition:0.2s;}
.card p{font-size:24px;font-weight:700;margin:5px 0 0;}
.card.active{border:2px solid #2196F3;transform:scale(1.05);}
.quick-date button{background:#2196F3;margin-right:5px;color:white;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;transition:0.2s;}
.quick-date button.active{border:2px solid #2196F3;transform:scale(1.05);}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px;}
.chart-box{background:white;padding:15px;border-radius:10px;box-shadow:0 5px 12px rgba(0,0,0,0.08);}
button{padding:6px 12px;border:none;background:#4CAF50;color:white;border-radius:6px;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px;}
th{background:#f2f2f2;}
.status-approved{background:#4CAF50;color:white;}
.status-pending{background:#FFD700;}
.status-rejected{background:#f44336;color:white;}
footer{position:fixed;bottom:0;width:100%;background:#fff;text-align:center;padding:8px;font-size:12px;box-shadow:0 -2px 5px rgba(0,0,0,0.1);}
@media(max-width:600px){.filter-box,.quick-date{flex-direction:column;align-items:flex-start;}}
</style>
</head>

<body>

<!-- Header with logo1 left, logo2 right -->
<div class="header">
  <div class="header-left">
    <img src="logo1.png" alt="Logo 1">
  </div>
  <div class="header-right">
    <img src="logo2.png" alt="Logo 2">
  </div>
</div>

<div class="container">

<div class="filter-box">
  <label>Hub:</label>
  <select id="hubSelector">
    <option value="">All</option>
    <option>Hub 1</option>
    <option>Hub 2</option>
    <option>Hub 3</option>
    <option>Hub 4</option>
    <option>Hub 5</option>
    <option>Hub 6</option>
    <option>Hub 7</option>
    <option>Hub 8</option>
    <option>Events</option>
    <option>SAS</option>
    <option>Retrieval</option>
    <option>Life Flight</option>
    <option>Others</option>
  </select>

  <label>From:</label>
  <input type="date" id="startDate">
  <label>To:</label>
  <input type="date" id="endDate">

  <input type="text" id="staffSearch" placeholder="Search Name / Corp">

  <button onclick="exportDashboardPDF()">Export PDF</button>
  <button id="resetFilters">Reset Filters</button>
</div>

<div class="quick-date">
  <button data-days="today">Today</button>
  <button data-days="7">Last 7 Days</button>
  <button data-days="15">Last 15 Days</button>
  <button data-days="30">Last 30 Days</button>
</div>

<div class="cards">
  <div class="card" data-status=""><h3>Total</h3><p id="total">0</p></div>
  <div class="card" data-status="approved"><h3>Approved</h3><p id="approved">0</p></div>
  <div class="card" data-status="pending"><h3>Pending</h3><p id="pending">0</p></div>
  <div class="card" data-status="rejected"><h3>Rejected</h3><p id="rejected">0</p></div>
  <div class="card"><h3>Late Hours</h3><p id="lateHours">0</p></div>
</div>

<div class="charts">
<div class="chart-box"><h3>Status</h3><canvas id="statusChart"></canvas></div>
<div class="chart-box"><h3>Hub Requests</h3><canvas id="hubChart"></canvas></div>
<div class="chart-box"><h3>Shift Requests</h3><canvas id="shiftChart"></canvas></div>
<div class="chart-box"><h3>Trend</h3><canvas id="trendChart"></canvas></div>
</div>

<div class="chart-box">
<h3>Requests Table</h3>
<table id="dataTable">
<thead>
<tr>
<th>Date Submitted</th>
<th>Late Call Date</th>
<th>Name</th>
<th>Corp</th>
<th>Hub</th>
<th>Shift</th>
<th>Late Hours</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<footer>
© 2026 HMCAS Support Service Production.<br>
James Ross Camins. All rights reserved.
</footer>

<script type="module">
import { getLateCalls } from './firebase.js';

let allRequests=[];
let statusChart, hubChart, shiftChart, trendChart;
let currentStatusFilter="";
let currentQuickDate="";

// Format functions
function formatDateTime(dateStr){
  const d=new Date(dateStr);
  const day=String(d.getDate()).padStart(2,'0');
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month=monthNames[d.getMonth()];
  const year=String(d.getFullYear()).slice(2);
  const hours=String(d.getHours()).padStart(2,'0');
  const minutes=String(d.getMinutes()).padStart(2,'0');
  return `${day} ${month} ${year} ${hours}:${minutes}`;
}
function formatDateOnly(dateStr){
  const d=new Date(dateStr);
  const day=String(d.getDate()).padStart(2,'0');
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month=monthNames[d.getMonth()];
  const year=String(d.getFullYear()).slice(2);
  return `${day} ${month} ${year}`;
}

// Load Firebase data
async function loadData(){
  try {
    allRequests = await getLateCalls();
    filterDashboard();
  } catch(e) { console.error("Error loading data:", e); }
}

// Quick date buttons
function setQuickDate(option){
  currentQuickDate = option;
  highlightQuickDate();
  const startInput = document.getElementById("startDate");
  const endInput = document.getElementById("endDate");
  const today = new Date(); today.setHours(0,0,0,0);
  let start;
  if(option==='today'){ start = new Date(today); }
  else { start = new Date(today); start.setDate(today.getDate()-(option-1)); }
  startInput.value = start.toISOString().split('T')[0];
  endInput.value = today.toISOString().split('T')[0];
  filterDashboard();
}

// Highlight quick date
function highlightQuickDate(){
  document.querySelectorAll(".quick-date button").forEach(btn=>{
    if(btn.dataset.days===currentQuickDate) btn.classList.add("active");
    else btn.classList.remove("active");
  });
}

// Status card filter
function filterByStatus(status){
  currentStatusFilter = status;
  highlightStatusCard();
  filterDashboard();
}

// Highlight active card
function highlightStatusCard(){
  document.querySelectorAll(".cards .card").forEach(c=>{
    if(c.dataset.status === currentStatusFilter) c.classList.add("active");
    else c.classList.remove("active");
  });
}

// Main filter
function filterDashboard(){
  const hubSelect=document.getElementById("hubSelector").value;
  const startDate=document.getElementById("startDate").value;
  const endDate=document.getElementById("endDate").value;
  const search=document.getElementById("staffSearch").value.toLowerCase();

  let data=[...allRequests];

  // HUB filter with "Others"
  if(hubSelect){
    if(hubSelect==='Others'){
      const knownHubs = ["Hub 1","Hub 2","Hub 3","Hub 4","Hub 5","Hub 6","Hub 7","Hub 8","Events","SAS","Retrieval","Life Flight"];
      data = data.filter(r=>!knownHubs.includes(r.hub));
    } else {
      data = data.filter(r=>r.hub===hubSelect);
    }
  }

  if(search) data=data.filter(r=>
    (r.name||"").toLowerCase().includes(search) ||
    (r.corp||"").toString().includes(search)
  );
  if(startDate) data=data.filter(r=>new Date(r.dateSubmitted)>=new Date(startDate));
  if(endDate) data=data.filter(r=>new Date(r.dateSubmitted)<=new Date(endDate+"T23:59:59"));
  if(currentStatusFilter) data=data.filter(r=>(r.status||"").toLowerCase()===currentStatusFilter.toLowerCase());

  updateDashboard(data);
}

// Update dashboard
function updateDashboard(data){
  let approved=0,pending=0,rejected=0,late=0;
  const hubs={},shifts={},dates={};

  data.forEach(r=>{
    const status=(r.status||"").toLowerCase();
    if(status==="approved") approved++;
    if(status==="pending") pending++;
    if(status==="rejected") rejected++;
    late+=parseFloat(r.lateHours||0);
    const hubName = ["Hub 1","Hub 2","Hub 3","Hub 4","Hub 5","Hub 6","Hub 7","Hub 8","Events","SAS","Retrieval","Life Flight"].includes(r.hub)? r.hub : "Others";
    hubs[hubName]=(hubs[hubName]||0)+1;
    shifts[r.shift]=(shifts[r.shift]||0)+1;
    const d=formatDateOnly(r.dateSubmitted);
    dates[d]=(dates[d]||0)+1;
  });

  document.getElementById("total").innerText=data.length;
  document.getElementById("approved").innerText=approved;
  document.getElementById("pending").innerText=pending;
  document.getElementById("rejected").innerText=rejected;
  document.getElementById("lateHours").innerText=late.toFixed(2);

  createStatusChart(approved,pending,rejected);
  createHubChart(hubs);
  createShiftChart(shifts);
  createTrendChart(dates);
  updateTable(data);
}

// Table
function updateTable(data){
  const tbody=document.querySelector("#dataTable tbody");
  tbody.innerHTML="";
  data.forEach(r=>{
    const tr=document.createElement("tr");
    let statusClass="";
    const status=(r.status||"").toLowerCase();
    if(status==="approved") statusClass="status-approved";
    if(status==="pending") statusClass="status-pending";
    if(status==="rejected") statusClass="status-rejected";
    tr.innerHTML=`
      <td>${formatDateTime(r.dateSubmitted)}</td>
      <td>${r.lateCallDate ? formatDateOnly(r.lateCallDate) : ""}</td>
      <td>${r.name}</td>
      <td>${r.corp}</td>
      <td>${r.hub}</td>
      <td>${r.shift}</td>
      <td>${r.lateHours||0}</td>
      <td class="${statusClass}">${r.status}</td>
    `;
    tbody.appendChild(tr);
  });
}

// Charts
function createStatusChart(a,p,r){
  if(statusChart) statusChart.destroy();
  statusChart=new Chart(document.getElementById("statusChart"),{
    type:"doughnut",
    data:{ labels:["Approved","Pending","Rejected"], datasets:[{data:[a,p,r],backgroundColor:["#4CAF50","#FFD700","#f44336"]}] }
  });
}
function createHubChart(data){
  if(hubChart) hubChart.destroy();
  hubChart=new Chart(document.getElementById("hubChart"),{
    type:"bar",
    data:{ labels:Object.keys(data), datasets:[{data:Object.values(data),backgroundColor:"#2196F3"}] },
    options:{ onClick:(e,el)=>{ if(el.length){ const hub=Object.keys(data)[el[0].index]; document.getElementById("hubSelector").value=hub; filterDashboard(); } } }
  });
}
function createShiftChart(data){
  if(shiftChart) shiftChart.destroy();
  shiftChart=new Chart(document.getElementById("shiftChart"),{
    type:"pie",
    data:{ labels:Object.keys(data), datasets:[{data:Object.values(data)}] }
  });
}
function createTrendChart(data){
  if(trendChart) trendChart.destroy();
  trendChart=new Chart(document.getElementById("trendChart"),{
    type:"line",
    data:{ labels:Object.keys(data), datasets:[{label:"Requests", data:Object.values(data), borderColor:"#4CAF50", tension:0.3}] }
  });
}

// Export PDF
async function exportDashboardPDF(){
  const { jsPDF } = window.jspdf;
  const canvas=await html2canvas(document.querySelector(".container"));
  const img=canvas.toDataURL("image/png");
  const pdf=new jsPDF("landscape","pt","a4");
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  pdf.addImage(img,"PNG",0,0,pageWidth,pageHeight);
  pdf.save("dashboard.pdf");
}

// Event listeners
document.querySelectorAll(".cards .card").forEach(c=>{
  if(c.dataset.status !== undefined) c.addEventListener("click",()=>filterByStatus(c.dataset.status));
});
document.querySelectorAll(".quick-date button").forEach(btn=>{
  btn.addEventListener("click",()=>setQuickDate(btn.dataset.days));
});
document.getElementById("resetFilters").addEventListener("click", () => {
  currentStatusFilter = "";
  currentQuickDate = "";
  document.getElementById("hubSelector").value = "";
  document.getElementById("startDate").value = "";
  document.getElementById("endDate").value = "";
  document.getElementById("staffSearch").value = "";
  highlightStatusCard();
  highlightQuickDate();
  filterDashboard();
});
document.getElementById("hubSelector").addEventListener("change",filterDashboard);
document.getElementById("startDate").addEventListener("change",filterDashboard);
document.getElementById("endDate").addEventListener("change",filterDashboard);
document.getElementById("staffSearch").addEventListener("input",filterDashboard);

// Initialize
loadData();

</script>

</body>
</html>
