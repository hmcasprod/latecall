<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Basic Styling */
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #eef2f3, #ffffff);
      padding-bottom: 60px;
    }

    .header {
      background: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .filter-box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <img src="logo1.png" alt="Logo 1">
    </div>
    <div class="header-right">
      <img src="logo2.png" alt="Logo 2">
    </div>
  </div>

  <div class="container">
    <div class="filter-box">
      <label>Hub:</label>
      <select id="hubSelector">
        <option value="">All</option>
        <option>Hub 1</option>
        <option>Hub 2</option>
        <option>Hub 3</option>
        <option>Hub 4</option>
        <option>Hub 5</option>
        <option>Hub 6</option>
        <option>Hub 7</option>
        <option>Hub 8</option>
        <option>Events</option>
        <option>SAS</option>
        <option>Retrieval</option>
        <option>Life Flight</option>
        <option>Others</option>
      </select>

      <label>From:</label>
      <input type="date" id="startDate">
      <label>To:</label>
      <input type="date" id="endDate">

      <input type="text" id="staffSearch" placeholder="Search Name / Corp">

      <button onclick="exportDashboardPDF()">Export PDF</button>
      <button id="resetFilters">Reset Filters</button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Total</h3>
        <p id="total">0</p>
      </div>
      <div class="card">
        <h3>Approved</h3>
        <p id="approved">0</p>
      </div>
      <div class="card">
        <h3>Pending</h3>
        <p id="pending">0</p>
      </div>
      <div class="card">
        <h3>Rejected</h3>
        <p id="rejected">0</p>
      </div>
      <div class="card">
        <h3>Late Hours</h3>
        <p id="lateHours">0</p>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <h3>Status</h3>
        <canvas id="statusChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Hub Requests</h3>
        <canvas id="hubChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Shift Requests</h3>
        <canvas id="shiftChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Trend</h3>
        <canvas id="trendChart"></canvas>
      </div>
    </div>

    <div class="chart-box">
      <h3>Requests Table</h3>
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date Submitted</th>
            <th>Late Call Date</th>
            <th>Name</th>
            <th>Corp</th>
            <th>Hub</th>
            <th>Shift</th>
            <th>Late Hours</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
  </footer>

  <script type="module">
    // Import external data fetching or other functions if needed
    async function loadData() {
      // You should simulate or load actual data here
    }

    async function exportDashboardPDF() {
      const { jsPDF } = window.jspdf;

      // Capture the content of the container as a canvas
      const container = document.querySelector(".container");
      const canvas = await html2canvas(container, { scale: 2 });
      const imgData = canvas.toDataURL("image/png");

      // Create a new PDF instance
      const pdf = new jsPDF("p", "pt", "a4");
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();

      // Get the dimensions of the image
      const imgWidth = pdfWidth;
      const imgHeight = (canvas.height * pdfWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 0;

      // Add the image to the PDF
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pdfHeight;

      // If the content is taller than a single page, add additional pages
      while (heightLeft > 0) {
        pdf.addPage();
        position = -heightLeft + pdfHeight;
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pdfHeight;
      }

      // Trigger the download
      pdf.save("dashboard.pdf");
    }

    // Simulate loading data here
    loadData();
  </script>

</body>

</html>
