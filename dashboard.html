<script type="module">
import { db } from './firebase.js';
import {
    collection,
    getDocs,
    updateDoc,
    doc,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

/* ==============================
   SUPERVISOR LOGIN (unchanged)
============================== */

if(!localStorage.getItem('supervisors')){
    const supervisorsInit = [
        {username:"jcamins", fullName:"James Camins", corp:"45357", password:"HMCAS1234"},
        {username:"hkerkeni", fullName:"Habib Kerkeni", corp:"11748", password:"HMCAS1234"}
    ];
    localStorage.setItem('supervisors', JSON.stringify(supervisorsInit));
}

window.togglePassword = function(){
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === "password" ? "text" : "password";
}

window.login = function(){
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    let supervisors = JSON.parse(localStorage.getItem('supervisors')) || [];
    const supervisor = supervisors.find(s => s.username===username && s.password===password);
    if(supervisor){
        localStorage.setItem('currentSupervisor', JSON.stringify(supervisor));
        checkLogin();
    } else {
        document.getElementById('errorMessage').innerText="Invalid username or password!";
    }
}

window.logout = function(){
    localStorage.removeItem('currentSupervisor');
    location.reload();
}

function checkLogin(){
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if(sup){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('dashboardPage').style.display='block';
        document.getElementById('managerName').innerText=`${sup.fullName} CN ${sup.corp}`;
        loadTable();
    }
}

checkLogin();

/* ==============================
   FIRESTORE TABLE LOADING
============================== */

async function loadTable(){
    const snapshot = await getDocs(collection(db, "requests"));
    const tbody = document.querySelector('#requestsTable tbody');
    tbody.innerHTML='';

    snapshot.forEach((docSnap)=>{
        const r = docSnap.data();
        const id = docSnap.id;

        let statusClass =
            r.status==="Pending" ? "status-pending" :
            r.status==="Approved" ? "status-approved" :
            "status-rejected";

        let actionButtons = r.status==="Pending" ? `
            <button class="action-btn" style="background:#4CAF50;color:#fff;" onclick="approveRequest('${id}')">✔</button>
            <button class="action-btn" style="background:#f44336;color:#fff;" onclick="rejectRequest('${id}')">✖</button>
        ` : "";

        tbody.innerHTML += `
            <tr>
                <td>${r.date}</td>
                <td>${r.name}</td>
                <td>${r.corp}</td>
                <td>${r.hub}</td>
                <td>${r.unit}</td>
                <td>${r.shift}</td>
                <td>${r.trip}</td>
                <td>${r.timeout}</td>
                <td>${r.typeOfDuty}</td>
                <td class="${statusClass}">${r.status}</td>
                <td>${actionButtons}</td>
                <td>${r.processedBy || ""}</td>
            </tr>
        `;
    });
}

/* ==============================
   APPROVE / REJECT
============================== */

window.approveRequest = async function(id){
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    await updateDoc(doc(db, "requests", id), {
        status: "Approved",
        processedBy: `${sup.fullName} CN ${sup.corp} (${new Date().toLocaleString()})`
    });
    loadTable();
}

window.rejectRequest = async function(id){
    const reason = prompt("Reason for Rejection:");
    if(!reason) return;

    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    await updateDoc(doc(db, "requests", id), {
        status: "Rejected",
        processedBy: `${sup.fullName} CN ${sup.corp} (${new Date().toLocaleString()}) - ${reason}`
    });
    loadTable();
}

</script>
