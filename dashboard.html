<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #eef2f3, #ffffff);
            color: #333;
        }

        .header-logos {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .filters input, .filters select {
            margin: 5px;
            padding: 5px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filters select {
            min-width: 150px;
        }

        .table-container {
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .action-btn {
            padding: 5px 10px;
            margin-right: 5px;
            border: none;
            cursor: pointer;
        }

        .status-pending {
            color: orange;
        }

        .status-approved {
            color: green;
        }

        .status-rejected {
            color: red;
        }
    </style>
</head>
<body>
<div class="header-logos">
    <img src="logo1.png" alt="Logo 1">
    <img src="logo2.png" alt="Logo 2">
</div>

<!-- Dashboard Page -->
<div id="dashboardPage">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 id="managerName"></h2>
        <button onclick="logout()" style="background:#f44336;color:#fff;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;">Logout</button>
    </div>

    <!-- Filters -->
    <div class="filters">
        <input type="date" id="filterFrom" placeholder="From" onchange="loadTable()">
        <input type="date" id="filterTo" placeholder="To" onchange="loadTable()">
        <select id="filterHub" onchange="loadTable()">
            <option value="">All Hubs</option>
            <!-- Add other hub options here -->
        </select>
        <select id="filterStatus" onchange="loadTable()">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
        </select>
        <select id="filterShift" onchange="loadTable()">
            <option value="">All Shifts</option>
            <option value="Day">Day</option>
            <option value="Peak">Peak</option>
            <option value="Night">Night</option>
            <option value="Event">Event</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Search" oninput="loadTable()">
    </div>

    <!-- Table Container -->
    <div class="table-container">
        <table id="requestsTable">
            <thead>
                <tr>
                    <th>Late Call Date</th><th>Date Submitted</th><th>Name</th><th>Corp Number</th>
                    <th>Hub</th><th>Unit</th><th>Shift</th>
                    <th>Trip</th><th>Time Out</th><th>Type of Duty</th>
                    <th>Status</th><th>Action</th><th>Processed By</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module">
import { getLateCalls, updateRequestStatus } from './firebase.js';

// Supervisor accounts (no change)
const supervisorsInit = [
    {username:"jcamins", fullName:"James Camins", corp:"45357", password:"HMCAS1234"},
    {username:"hkerkeni", fullName:"Habib Kerkeni", corp:"11748", password:"HMCAS1234"}
];
localStorage.setItem('supervisors', JSON.stringify(supervisorsInit));

// Check login function
function checkLogin() {
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if (sup) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'block';
        document.getElementById('managerName').innerText = `${sup.fullName} CN ${sup.corp}`;
        loadTable();
        startInactivityTimer();
    }
}

// Load table function (with Late Call Date properly formatted)
async function loadTable() {
    const data = await getLateCalls();
    const tbody = document.querySelector('#requestsTable tbody');
    tbody.innerHTML = '';
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;
    const hub = document.getElementById('filterHub').value;
    const statusFilter = document.getElementById('filterStatus').value;
    const shiftFilter = document.getElementById('filterShift').value;
    const search = document.getElementById('filterSearch').value.toLowerCase();

    let rows = [];

    data.forEach(r => {
        const lateCallDate = new Date(r.lateCallDate); // Use lateCallDate instead of dateSubmitted

        // Check if the lateCallDate is valid
        if (isNaN(lateCallDate.getTime())) {
            console.error("Invalid late call date:", r.lateCallDate);
            return;
        }

        let include = true;
        if (from && new Date(from) > lateCallDate) include = false;
        if (to && new Date(to) < lateCallDate) include = false;
        if (hub && r.hub !== hub) include = false;
        if (statusFilter && r.status !== statusFilter) include = false;
        if (shiftFilter && r.shift !== shiftFilter) include = false;
        if (search && !(`${r.name} ${r.corp} ${r.unit} ${r.shift} ${r.typeOfDuty} ${r.trip}`.toLowerCase().includes(search))) include = false;

        if (include) {
            const statusNormalized = (r.status || "").trim().toLowerCase();
            const statusClass = statusNormalized === "pending" ? "status-pending" :
                statusNormalized === "approved" ? "status-approved" :
                    statusNormalized === "rejected" ? "status-rejected" : "";

            const actionButtons = statusNormalized === "pending" ?
                `<button class="action-btn" style="background:#4CAF50;color:#fff;" onclick="approve('${r.id}')">✔</button>
                <button class="action-btn" style="background:#f44336;color:#fff;" onclick="reject('${r.id}')">✖</button>`
                : "";

            // Format the lateCallDate to DD-MMM-YYYY (e.g., 24-Feb-2026)
            const formattedLateCallDate = lateCallDate.toLocaleDateString('en-GB', {
                year: 'numeric',
                month: 'short',
                day: '2-digit'
            });

            // Format the time of the Late Call Date to 24-hour format without seconds (e.g., 22:18)
            const formattedLateCallTime = lateCallDate.toLocaleTimeString('en-GB', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit'
            });

            // Combine the date and time for the Late Call Date
            const formattedLateCallDateTime = `${formattedLateCallDate} ${formattedLateCallTime}`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${formattedLateCallDateTime}</td>
                <td>${r.dateSubmitted}</td>
                <td>${r.name}</td>
                <td>${r.corp}</td>
                <td>${r.hub}</td>
                <td>${r.unit}</td>
                <td>${r.shift}</td> <!-- Shift Column -->
                <td>${r.trip}</td>
                <td>${r.timeout}</td>
                <td>${r.typeOfDuty}</td>
                <td class="${statusClass}">${r.status}</td>
                <td>${actionButtons}</td>
                <td>${r.processedBy || ''}</td>
            `;
            rows.push(tr);
        }
    });

    // Sort rows in descending order (newest at the top)
    rows.sort((a, b) => {
        const dateA = new Date(a.cells[0].innerText);
        const dateB = new Date(b.cells[0].innerText);
        return dateB - dateA; // Sort in descending order (newest first)
    });

    // Append the sorted rows to the table body
    rows.forEach(row => tbody.appendChild(row));
}

// Initial check
checkLogin();

// Expose functions to HTML
window.logout = logout;
window.loadTable = loadTable;
window.approve = approve;
window.reject = reject;
</script>

<footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
</footer>

</body>
</html>
