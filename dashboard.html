// Check login function
function checkLogin(){
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if(sup){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('dashboardPage').style.display='block';
        document.getElementById('managerName').innerText = `${sup.fullName} CN ${sup.corp}`;
        loadTable();
        startInactivityTimer();
    }
}

// Load table function (with Late Call Date properly formatted)
async function loadTable(){
    const data = await getLateCalls();
    const tbody = document.querySelector('#requestsTable tbody');
    tbody.innerHTML = '';
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;
    const hub = document.getElementById('filterHub').value;
    const statusFilter = document.getElementById('filterStatus').value;
    const shiftFilter = document.getElementById('filterShift').value;
    const search = document.getElementById('filterSearch').value.toLowerCase();

    let rows = [];

    data.forEach(r => {
        const lateCallDate = new Date(r.lateCallDate); // Use lateCallDate instead of dateSubmitted

        // Check if the lateCallDate is valid
        if (isNaN(lateCallDate.getTime())) {
            console.error("Invalid late call date:", r.lateCallDate);
            return;
        }

        let include = true;
        if(from && new Date(from) > lateCallDate) include = false;
        if(to && new Date(to) < lateCallDate) include = false;
        if(hub && r.hub !== hub) include = false;
        if(statusFilter && r.status !== statusFilter) include = false;
        if(shiftFilter && r.shift !== shiftFilter) include = false;
        if(search && !(`${r.name} ${r.corp} ${r.unit} ${r.shift} ${r.typeOfDuty} ${r.trip}`.toLowerCase().includes(search))) include = false;

        if(include){
            const statusNormalized = (r.status || "").trim().toLowerCase();
            const statusClass = statusNormalized === "pending" ? "status-pending" :
                                statusNormalized === "approved" ? "status-approved" :
                                statusNormalized === "rejected" ? "status-rejected" : "";

            const actionButtons = statusNormalized === "pending" ? 
                `<button class="action-btn" style="background:#4CAF50;color:#fff;" onclick="approve('${r.id}')">✔</button>
                <button class="action-btn" style="background:#f44336;color:#fff;" onclick="reject('${r.id}')">✖</button>` 
             : "";

            // Format the lateCallDate to DD-MMM-YYYY (e.g., 24-Feb-2026)
            const formattedLateCallDate = lateCallDate.toLocaleDateString('en-GB', { 
                year: 'numeric', 
                month: 'short', 
                day: '2-digit' 
            });

            // Format the time of the Late Call Date to 24-hour format without seconds (e.g., 22:18)
            const formattedLateCallTime = lateCallDate.toLocaleTimeString('en-GB', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            // Combine the date and time for the Late Call Date
            const formattedLateCallDateTime = `${formattedLateCallDate} ${formattedLateCallTime}`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${formattedLateCallDateTime}</td>  <!-- Display the formatted Late Call Date with time -->
                <td>${r.dateSubmitted}</td>  <!-- You can keep the Date Submitted column as is, or adjust it as needed -->
                <td>${r.name}</td>
                <td>${r.corp}</td>
                <td>${r.hub}</td>
                <td>${r.unit}</td>
                <td>${r.shift}</td> <!-- Display the Shift -->
                <td>${r.trip}</td>
                <td>${r.timeout}</td>
                <td>${r.typeOfDuty}</td>
                <td class="${statusClass}">${r.status}</td>
                <td>${actionButtons}</td>
                <td>${r.processedBy || ''}</td>
            `;
            rows.push(tr);
        }
    });

    // Sort rows in descending order (newest at the top)
    rows.sort((a, b) => {
        const dateA = new Date(a.cells[0].innerText);  
        const dateB = new Date(b.cells[0].innerText);  
        return dateB - dateA; // Sort in descending order (newest first)
    });

    // Append the sorted rows to the table body
    rows.forEach(row => tbody.appendChild(row));
}
