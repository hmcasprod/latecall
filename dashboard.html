<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Existing styles... */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #eef2f3, #ffffff);
            color: #333;
        }
        .header-logos {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }
        .header-logos img {
            height: 40px;
        }
        .table-container {
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
        }
        .status-pending { background-color: yellow; }
        .status-approved { background-color: green; color: white; }
        .status-rejected { background-color: red; color: white; }
        .action-btn {
            padding: 4px 8px;
            margin: 0 2px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
        }
        #filters input {
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="header-logos">
    <img src="logo1.png" alt="Logo 1">
    <img src="logo2.png" alt="Logo 2">
</div>

<!-- Login Page -->
<div id="loginPage">
    <!-- Add your login form here -->
</div>

<!-- Dashboard Page -->
<div id="dashboardPage" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 id="managerName"></h2>
        <button onclick="logout()" style="background:#f44336;color:#fff;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;">Logout</button>
    </div>

    <!-- Filters -->
    <div id="filters" style="margin-bottom: 20px;">
        <input id="filterFrom" type="date" placeholder="From Date">
        <input id="filterTo" type="date" placeholder="To Date">
        <input id="filterHub" type="text" placeholder="Hub">
        <input id="filterStatus" type="text" placeholder="Status">
        <input id="filterShift" type="text" placeholder="Shift">
        <input id="filterSearch" type="text" placeholder="Search">
    </div>

    <!-- Table Container -->
    <div class="table-container">
        <table id="requestsTable">
            <thead>
                <tr>
                    <th>Date Submitted</th><th>Late Call Date</th><th>Name</th><th>Corp Number</th>
                    <th>Hub</th><th>Unit</th><th>Shift</th>
                    <th>Trip</th><th>Time Out</th><th>Type of Duty</th>
                    <th>Status</th><th>Action</th><th>Processed By</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button onclick="exportToExcel()">Export to Excel</button>
</div>

<script type="module">
import { getLateCalls, updateRequestStatus } from './firebase.js';

const supervisorsInit = [
    {username:"jcamins", fullName:"James Camins", corp:"45357", password:"HMCAS1234"},
    {username:"hkerkeni", fullName:"Habib Kerkeni", corp:"11748", password:"HMCAS1234"}
];
localStorage.setItem('supervisors', JSON.stringify(supervisorsInit));

// Check login function
function checkLogin() {
    const sup = JSON.parse(localStorage.getItem('currentSupervisor'));
    if (sup) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'block';
        document.getElementById('managerName').innerText = `${sup.fullName} CN ${sup.corp}`;
        loadTable();
    }
}

// Load table function (with filters)
async function loadTable() {
    try {
        const data = await getLateCalls();
        const tbody = document.querySelector('#requestsTable tbody');
        tbody.innerHTML = '';
        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;
        const hub = document.getElementById('filterHub').value;
        const statusFilter = document.getElementById('filterStatus').value;
        const shiftFilter = document.getElementById('filterShift').value;
        const search = document.getElementById('filterSearch').value.toLowerCase();

        let rows = [];

        data.forEach(r => {
            const d = new Date(r.dateSubmitted); 
            if (isNaN(d.getTime())) return; // Invalid date check

            const lateCallDate = new Date(r.lateCallDate);
            let include = true;
            if (from && new Date(from) > d) include = false;
            if (to && new Date(to) < d) include = false;
            if (hub && r.hub !== hub) include = false;
            if (statusFilter && r.status !== statusFilter) include = false;
            if (shiftFilter && r.shift !== shiftFilter) include = false;
            if (search && !(`${r.name} ${r.corp} ${r.unit} ${r.shift} ${r.typeOfDuty} ${r.trip}`.toLowerCase().includes(search))) include = false;

            if (include) {
                const statusClass = r.status === "pending" ? "status-pending" :
                                    r.status === "approved" ? "status-approved" :
                                    r.status === "rejected" ? "status-rejected" : "";

                const actionButtons = r.status === "pending" ? 
                    `<button class="action-btn" style="background:#4CAF50;color:#fff;" onclick="approve('${r.id}')">✔</button>
                    <button class="action-btn" style="background:#f44336;color:#fff;" onclick="reject('${r.id}')">✖</button>` 
                 : "";

                const formattedDate = d.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: '2-digit' 
                });

                const formattedTime = d.toLocaleTimeString('en-GB', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });

                const formattedDateTime = `${formattedDate} ${formattedTime}`;
                const formattedLateCallDate = lateCallDate.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: '2-digit' 
                });

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${formattedDateTime}</td>
                    <td>${formattedLateCallDate}</td>
                    <td>${r.name}</td>
                    <td>${r.corp}</td>
                    <td>${r.hub}</td>
                    <td>${r.unit}</td>
                    <td>${r.shift}</td>
                    <td>${r.trip}</td>
                    <td>${r.timeout}</td>
                    <td>${r.typeOfDuty}</td>
                    <td class="${statusClass}">${r.status}</td>
                    <td>${actionButtons}</td>
                    <td>${r.processedBy || ''}</td>
                `;
                rows.push(tr);
            }
        });

        rows.sort((a, b) => {
            const dateA = new Date(a.cells[0].innerText.split(' ')[0]);
            const dateB = new Date(b.cells[0].innerText.split(' ')[0]);
            return dateB - dateA;
        });

        rows.forEach(row => tbody.appendChild(row));

    } catch (error) {
        console.error('Error loading table data:', error);
    }
}

// Approve/Reject functions
async function approve(requestId) {
    await updateRequestStatus(requestId, 'approved');
    loadTable();
}

async function reject(requestId) {
    await updateRequestStatus(requestId, 'rejected');
    loadTable();
}

// Export to Excel function
function exportToExcel() {
    // You can use libraries like SheetJS to implement this functionality
    console.log('Export to Excel');
}

// Inactivity logout
function startInactivityTimer() {
    let timeout;
    window.onload = resetTimer;
    window.onmousemove = resetTimer;
    window.onkeydown = resetTimer;

    function logout() {
        // Implement logout logic
    }

    function resetTimer() {
        clearTimeout(timeout);
        timeout = setTimeout(logout, 60000); // 1 minute of inactivity
    }
}

// Initial check
checkLogin();

</script>

<footer>
    © 2026 HMCAS Support Service Production.<br>
    James Ross Camins. All rights reserved.
</footer>

</body>
</html>
